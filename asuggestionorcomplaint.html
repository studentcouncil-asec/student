    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #f8f9fa;
            --text-color: #212529;
            --accent-color: #2c3e50;
            --border-color: #dee2e6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background: var(--primary-color); color: var(--text-color); line-height: 1.6; }

        header {
            background: var(--primary-color);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        a { text-decoration: none; color: inherit; }

        .header-container {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1200px; margin: 0 auto;
        }

        .logo { 
            font-size: 1.5rem; 
            font-weight: 700; 
            color: var(--accent-color); 
        }

        .nav-menu { display: flex; list-style: none; }
        .nav-menu li { margin-left: 1.5rem; }

        .nav-menu {
            display: flex;
            list-style: none;
        }

        .nav-menu li {
            margin-left: 1.5rem;
        }

        .nav-menu a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-menu a:hover {
            color: var(--accent-color);
        }

        .mobile-menu-btn {
            width: 30px;
            height: 30px;
            font-size: 22px;
            padding: 0;
            line-height: 28px;
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .header-container {
                padding: 0 1rem;
            }

            .nav-menu {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background-color: var(--primary-color);
                border-top: 1px solid var(--border-color);
                padding: 1rem;
            }

            .nav-menu.active {
                display: flex;
            }

            .nav-menu li {
                margin: 0.5rem 0;
            }

            .mobile-menu-btn {
                display: block;
            }
        }

        #feedback { padding: 4rem 1.5rem; background: #f3f4f6; }

        .feedback-box {
            background: white; padding: 2rem; border-radius: 1rem;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
            max-width: 700px; margin: auto;
        }

        .info-box {
            background: #dbeafe; border-left: 4px solid #2563eb;
            padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem;
        }

        textarea, input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #ccc; font-size: 1rem;
            margin-bottom: 10px;
        }

        button {
            width: 100%; padding: 12px; border: none;
            background: #2563eb; color: white;
            border-radius: 8px; cursor: pointer;
        }

        footer {
            background: var(--accent-color);
            color: white; text-align: center; padding: 2rem;
            margin-top: 3rem;
        }

        .field-error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: -6px;
            margin-bottom: 8px;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <div class="header-container">
        <a href="https://studentcouncil-asec.github.io/student/index.html" class="logo">ՈՒսանողական Խորհուրդ</a>

        <button class="mobile-menu-btn">☰</button>

        <ul class="nav-menu">
            <li><a href="https://studentcouncil-asec.github.io/student/index.html">Գլխավոր</a></li>
            <li><a href="https://studentcouncil-asec.github.io/student/dox.html">Փաստաթղթեր</a></li>
            <li><a href="https://studentcouncil-asec.github.io/student/asuggestionorcomplaint.html">Առաջարկ/Բողոք</a></li>
        </ul>
    </div>
</header>

<section id="feedback">
    <h2 style="text-align:center;" data-aos="fade-up">Ուղարկեք ձեր բողոքը կամ առաջարկը</h2>

    <div class="feedback-box" data-aos="fade-up">
        <div class="info-box">
            Ձեր տվյալները չեն պահպանվում։ Ցանկության դեպքում կարող եք թողնել կապի տվյալներ։
        </div>

        <form id="feedbackForm" action="https://formspree.io/f/mgvgrpgp" method="POST">

            <input type="hidden" name="committee" value="boxoq_arajarkner">

            <label>Ձեր նամակը</label>
            <textarea name="message" rows="6" required></textarea>

            <label style="font-weight:600; margin-top:12px; display:block;">Էլ. փոստ (ոչ պարտադիր)</label>
            <input 
                type="text" 
                name="email" 
                id="emailField"
                placeholder="example@gmail.com"
                style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; margin-bottom:4px;"
            >
            <div class="field-error" id="emailError">Մուտքագրեք ճիշտ էլ. փոստ (պետք է պարունակի @ և .)</div>

            <label style="font-weight:600; margin-bottom:6px; display:block;">Հեռախոսահամար (ոչ պարտադիր)</label>
            <input 
                type="tel" 
                name="phone" 
                id="phone"
                placeholder="+374 55 55 55 55"
                style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc;"
            >

            <div style="margin-top: 14px;">
                <button type="submit">Ուղարկել</button>
            </div>
        </form>
    </div>
</section>

<footer>
    <p>© 2026 Ուսանողական Խորհուրդ</p>
</footer>

<script>
    const phoneInput = document.getElementById('phone');
    const emailInput = document.getElementById('emailField');
    const emailError = document.getElementById('emailError');
    const form = document.getElementById('feedbackForm');

    /* ── Mobile menu ── */
    document.querySelector('.mobile-menu-btn').addEventListener('click', function () {
        document.querySelector('.nav-menu').classList.toggle('active');
    });

    document.addEventListener('click', function (event) {
        const menu = document.querySelector('.nav-menu');
        const button = document.querySelector('.mobile-menu-btn');
        if (!menu.contains(event.target) && !button.contains(event.target)) {
            menu.classList.remove('active');
        }
    });

    /* ── Phone formatting ── */
    phoneInput.addEventListener('focus', function () {
        if (this.value === '') {
            this.value = '+374 ';
        }
    });

    phoneInput.addEventListener('blur', function () {
        if (this.value === '+374 ' || this.value === '+374') {
            this.value = '';
        }
    });

    phoneInput.addEventListener('input', function () {
        let raw = this.value;

        // Keep the +374 prefix always
        const prefix = '+374 ';
        if (!raw.startsWith(prefix)) {
            // Allow user to type before prefix is fully there
            if (raw.startsWith('+374') && raw.length < prefix.length) {
                return;
            }
            raw = prefix + raw.replace(/^\+374\s?/, '');
        }

        // Extract only the digits after +374
        let digits = raw.slice(prefix.length).replace(/\D/g, '');

        // Limit to 8 digits (XX XX XX XX)
        digits = digits.slice(0, 8);

        // Format: XX XX XX XX
        let formatted = '';
        for (let i = 0; i < digits.length; i++) {
            if (i > 0 && i % 2 === 0) formatted += ' ';
            formatted += digits[i];
        }

        this.value = prefix + formatted;
    });

    // Prevent deleting the prefix with backspace/delete
    phoneInput.addEventListener('keydown', function (e) {
        const prefix = '+374 ';
        if ((e.key === 'Backspace' || e.key === 'Delete') && this.value.length <= prefix.length) {
            e.preventDefault();
        }
    });

    /* ── Email validation (only checks @ and .) ── */
    function validateEmail(value) {
        if (value === '') return true; // optional field
        return value.includes('@') && value.includes('.');
    }

    emailInput.addEventListener('blur', function () {
        if (!validateEmail(this.value)) {
            emailError.style.display = 'block';
            this.style.borderColor = '#dc2626';
        } else {
            emailError.style.display = 'none';
            this.style.borderColor = '#ccc';
        }
    });

    emailInput.addEventListener('input', function () {
        if (validateEmail(this.value)) {
            emailError.style.display = 'none';
            this.style.borderColor = '#ccc';
        }
    });

    form.addEventListener('submit', function (e) {
        if (!validateEmail(emailInput.value)) {
            e.preventDefault();
            emailError.style.display = 'block';
            emailInput.style.borderColor = '#dc2626';
            emailInput.focus();
        }
    });
</script>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
    AOS.init();
</script>

</body>
</html>
